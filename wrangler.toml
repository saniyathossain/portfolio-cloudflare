name = "portfolio-cloudflare"
main = "src/index.ts"
compatibility_date = "2024-12-01"
# Custom domain: saniyat.com (configure in Cloudflare dashboard → Workers → Domains & Routes)

[assets]
directory = "./dist"
binding = "ASSETS"
# Without this the Static-Assets router serves public/ directly and src/index.ts never runs for
# HTML/asset requests — silently dropping the CSP/COOP/CORP headers, the Early-Hints Link header,
# and normalized Cache-Control (see docs/aidlc/43-pagespeed-cloudflare-edge.md). Forces the Worker
# to run for every request so those always apply.
run_worker_first = true
# Unknown URLs get the Astro-generated 404 page (dist/404.html, the shell-console error page) with a 404 status.
not_found_handling = "404-page"

# Outage / error pages (404, 500, 502, 503 maintenance, offline) are generated by Astro from
# src/content/errors.json and served from /errors/<slug>/ — the Worker fetches them via the ASSETS binding.

# --- Contact form (POST /api/contact) --------------------------------------------------------------
# All three backing services below are OPTIONAL and guarded in src/index.ts: the endpoint validates
# and returns success even before they're configured, so deploying in stages is safe.

# Public, non-secret vars. CONTACT_FROM must be an address on a domain with Email Routing enabled;
# CONTACT_TO must be a VERIFIED destination address in Email Routing.
[vars]
CONTACT_FROM = "contact@saniyat.com"
CONTACT_TO = "saniyat1000@gmail.com"

# ── Tunables (optional Worker vars; docs/aidlc/66 lists every name, range and default) ──────────────
# Each overrides the matching value in src/content/security.json. Leave commented to use the JSON defaults.
# Invalid values (not a whole number, or out of range) are ignored and logged once as `invalid_env_config`.
# RATE_LIMIT_CONTACT_LIMIT = "3"
# RATE_LIMIT_CONTACT_WINDOW_SECONDS = "600"
# RATE_LIMIT_ADMIN_FAILURE_LIMIT = "5"
# RATE_LIMIT_ADMIN_FAILURE_WINDOW_SECONDS = "900"
# RATE_LIMIT_CSP_REPORT_LIMIT = "20"
# RATE_LIMIT_CSP_REPORT_WINDOW_SECONDS = "60"
# MAX_CONTACT_BODY_BYTES = "16384"
# MAX_CSP_REPORT_BYTES = "8192"
# MAX_URL_LENGTH = "2048"
# CONTACT_RETENTION_SECONDS = "31536000"
# MAINTENANCE_RETRY_AFTER_SECONDS = "3600"
# ADMIN_LIST_DEFAULT_LIMIT = "50"
# ADMIN_LIST_MAX_LIMIT = "200"

# ── Feature flags (Worker vars) ────────────────────────────────────────────────────────────────────
# Truthy: "1" / "true" / "on".  Falsy: "off" / "false" / "0".  Omit SKILLS_SCROLL_DESIGN → JSON default.
MAINTENANCE_MODE = "off"

# ── Logging (src/content/logging.json) ────────────────────────────────────────────────────────────
# LOG_CHANNEL picks a channel (stack | stdout | stderr | kv | database | silent); unset = the JSON default.
# LOG_LEVEL (debug|info|warn|error) raises the floor for every channel. Both optional.
# LOG_CHANNEL = "stderr"
# LOG_LEVEL = "warn"
# SKILLS_SCROLL_DESIGN = "off"   # Tools & craft scroll layout — optional; local default in portfolio.json → site.features.flags

# ⚠️ The two bindings below are COMMENTED OUT so the first deploy succeeds with no setup.
# They are OPTIONAL and guarded in src/index.ts (the contact endpoint still validates + logs; it just
#
# Email Routing send_email binding — lets the Worker send the notification email.
#   1. Dashboard → your zone → Email → Email Routing → enable + verify the destination (CONTACT_TO).
#   2. Uncomment the 3 lines below, then redeploy.
# [[send_email]]
# name = "CONTACT_EMAIL"
# destination_address = "saniyat1000@gmail.com"
#
# KV — durable record of every submission (free tier).
#   1. Create it once:  npx wrangler kv namespace create CONTACT_KV
#   2. Paste the printed id below, uncomment the 3 lines, then redeploy.
# [[kv_namespaces]]
# binding = "CONTACT_KV"
# id = "PASTE_REAL_KV_NAMESPACE_ID"

# Log storage channels (optional, guarded — a channel is a no-op until its binding exists):
#   kv       → [[kv_namespaces]] binding = "LOG_KV"   (records expire after ttlSeconds)
#   database → [[d1_databases]]  binding = "LOG_DB"   (apply migrations/0001_create_logs_table.sql first)
# [[kv_namespaces]]
# binding = "LOG_KV"
# id = "PASTE_REAL_KV_NAMESPACE_ID"
# [[d1_databases]]
# binding = "LOG_DB"
# database_name = "portfolio-logs"
# database_id = "PASTE_REAL_D1_ID"

# Turnstile SECRET key — set as an encrypted secret, NOT here:
#   npx wrangler secret put TURNSTILE_SECRET
# (Create the widget in Dashboard → Turnstile; put its SITE key in portfolio.json → site.turnstileSiteKey.)

# Admin token for the read endpoint (GET /api/contact?token=... → recent submissions). Set via:
#   npx wrangler secret put ADMIN_TOKEN
# The GET endpoint returns 401 until this is set. Not linked from the UI.

# ── Security (docs/aidlc/57) ──────────────────────────────────────────────────────────────────────
# Optional atomic rate limiter. The Worker uses it automatically when bound as RATE_LIMITER and otherwise falls
# back to KV counters, then to per-isolate memory. Thresholds for the fallbacks: src/content/security.json.
# [[ratelimits]]
# name = "RATE_LIMITER"
# namespace_id = "1001"
#   [ratelimits.simple]
#   limit = 10
#   period = 60
